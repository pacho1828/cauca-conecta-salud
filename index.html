<style>
/* Concepto: panel clínico de dos zonas (navegación lateral + contenido); en celular la navegación pasa a barra inferior y las tablas a tarjetas.
   Tipografía: Atkinson Hyperlegible (diseñada para baja visión, adecuada para personal de salud en campo) + IBM Plex Mono para SMS y registro. */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface2:#EDF0EA; --line:#D6DAD0;
  --fg:#1F2420; --muted:#5F675F; --accent:#0F6E56; --accent-soft:#DDF1E9; --accent-fg:#FFFFFF;
  --crit:#B3261E; --crit-soft:#FBE7E5; --warn:#8A5300; --warn-soft:#FAEFD6; --ok:#2F6B12; --ok-soft:#E5F0DA;
  --phone:#2B2F2B; --lcd:#DCE6CE; --lcd-fg:#1F2420;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131713; --surface:#1B201B; --surface2:#242A24; --line:#333B33;
  --fg:#ECEFE8; --muted:#A3ABA1; --accent:#55C9A5; --accent-soft:#17312A; --accent-fg:#0A1F18;
  --crit:#FF8A84; --crit-soft:#3B1F1E; --warn:#F2B658; --warn-soft:#382A10; --ok:#97D062; --ok-soft:#223018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131713; --surface:#1B201B; --surface2:#242A24; --line:#333B33;
  --fg:#ECEFE8; --muted:#A3ABA1; --accent:#55C9A5; --accent-soft:#17312A; --accent-fg:#0A1F18;
  --crit:#FF8A84; --crit-soft:#3B1F1E; --warn:#F2B658; --warn-soft:#382A10; --ok:#97D062; --ok-soft:#223018; color-scheme:dark}

  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}

.search{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px}

.st{font-size:12.5px;color:var(--muted)}

.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}

.fphone form{display:flex;gap:6px;margin-top:10px}
.fphone input{flex:1;min-width:0;min-height:44px;border-radius:6px;border:0;padding:8px 10px;background:#F4F8EC;color:var(--lcd-fg);font-family:var(--mono);font-size:13px}
.fphone .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fphone .chip{background:#3B403B;color:#E8F0E1;border-color:#4C534C;font-size:12.5px;min-height:34px}
.ussd{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap;color:#E8F0E1;font-size:12.5px}
.ussd button{background:none;border:1px solid #5A615A;color:#E8F0E1;border-radius:6px;padding:5px 9px;font-size:12.5px;min-height:34px}
table.rules{width:100%;border-collapse:collapse;font-size:14px}
table.rules th,table.rules td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.foot{margin-top:18px;color:var(--muted);font-size:12.5px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;line-height:1.15;margin-bottom:22px}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.stepper{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media (min-width:900px){
  .app{grid-template-columns:220px minmax(0,1fr);column-gap:28px}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:100vh;padding:20px 0;border-right:1px solid var(--line);padding-right:16px}
  .side button.nav{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:10px 10px;text-align:left;min-height:44px;font-size:15px}
  .side button.nav:hover{background:var(--surface2)}
  .side button.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .side .who2{margin-top:auto;font-size:13px;color:var(--muted)}
  .tabs{display:none}
  .main{padding-bottom:40px}
  .toast{bottom:24px}
  .grid2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .smsgrid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .row{grid-template-columns:minmax(0,2fr) 70px minmax(0,1.3fr) 112px;grid-template-areas:"who cond rep pill"}
  .row .rep{text-align:left}
  .row .pill{justify-self:start}
}
@media (prefers-reduced-motion:no-preference){.sheet .sp{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
"use strict";
const H=3600e3, MIN=60e3;
const VIEWS=[["resumen","Resumen","M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"],
 ["pacientes","Pacientes","M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17.5 11.5a2.5 2.5 0 1 0 0-5M17 14.2c2.6.2 4.5 2 4.5 5.8"],
 ["alertas","Alertas","M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"],
 ["sms","SMS","M4 5h16v11H9l-5 4z"],
 ["reglas","Reglas","M4 7h10M18 7h2M4 17h2M10 17h10M16 7m-2 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0M8 17m-2 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0"]];
const TITLES={resumen:"Resumen del día",pacientes:"Pacientes",alertas:"Alertas",sms:"Mensajes SMS",reglas:"Reglas clínicas"};
const EXPECT={"DM2":"GLU","HTA":"TA","Gest.":"TA","TB":"DOSIS"};
const STEPS=["Programar","Enviar","SMS","Respuesta","Gateway","Registro","Reglas","Alerta"];
const cfg0={glu:180,sis:160,gsis:140,horas:48};

let S;
function seed(){
  const t=h=>Date.now()-h*H;
  const P=(id,name,age,vereda,cond,rs)=>({id,name,age,vereda,cond,readings:rs.map(([h,type,v])=>({t:t(h),type,v})),lastIn:t(rs[rs.length-1][0])});
  const patients=[
    P(1,"M. Ruiz",54,"La Esperanza","DM2",[[150,"GLU",118],[126,"GLU",125],[102,"GLU",132],[78,"GLU",150],[54,"GLU",188],[30,"GLU",240],[.2,"GLU",312]]),
    P(2,"J. Tombé",61,"El Placer","HTA",[[120,"TA",[150,95]],[72,"TA",[158,98]],[2,"TA",[168,102]]]),
    P(3,"L. Chocué",27,"San Antonio","Gest.",[[170,"TA",[118,76]],[100,"TA",[122,78]],[52,"TA",[120,78]]]),
    P(4,"A. Mera",39,"Los Andes","TB",[[130,"DOSIS","SI"],[106,"DOSIS","SI"],[82,"DOSIS","SI"],[58,"DOSIS","SI"],[34,"DOSIS","SI"],[3,"DOSIS","NO"]]),
    P(5,"C. Ipia",58,"La Esperanza","HTA",[[96,"TA",[132,84]],[48,"TA",[130,82]],[5,"TA",[128,82]]]),
    P(6,"R. Muñoz",47,"El Placer","DM2",[[110,"GLU",104],[62,"GLU",115],[8,"GLU",110]]),
    P(7,"D. Pito",31,"Los Andes","Gest.",[[100,"TA",[122,80]],[50,"TA",[128,84]],[1,"TA",[150,96]]]),
    P(8,"S. Yatacué",66,"San Antonio","HTA",[[90,"TA",[158,96]],[40,"TA",[170,104]],[3,"TA",[190,115]]]),
    P(9,"E. Nene",44,"El Placer","TB",[[130,"DOSIS","SI"],[84,"DOSIS","SI"],[60,"DOSIS","SI"]]),
    P(10,"F. Güetio",52,"La Esperanza","DM2",[[150,"GLU",112],[100,"GLU",118],[49,"GLU",121]]),
    P(11,"N. Camayo",36,"Los Andes","HTA",[[88,"TA",[124,80]],[40,"TA",[126,82]],[6,"TA",[122,78]]]),
    P(12,"P. Dagua",29,"San Antonio","Gest.",[[92,"TA",[112,70]],[44,"TA",[116,74]],[7,"TA",[114,72]]])];
  const msgs=[];
  patients.forEach(p=>p.readings.forEach(r=>{
    msgs.push({pid:p.id,dir:"out",text:remindText(p),t:r.t-6*MIN});
    msgs.push({pid:p.id,dir:"in",text:readingText(r),t:r.t});}));
  [3,9,10].forEach(id=>{const p=patients[id-1];msgs.push({pid:id,dir:"out",text:remindText(p),t:Date.now()-(id===9?26:20)*H});});
  return {patients,msgs,alertState:{},cfg:{...cfg0},log:[{t:Date.now(),text:"Sistema iniciado con datos de ejemplo"}],flow:{pid:1,lit:0,alert:false},selPid:1,view:"resumen",afilter:"todas",pfilter:"todos",q:""};
}
function remindText(p){
  if(p.cond==="DM2")return `CCS: Hola ${p.name}. Reporte su glucosa hoy. Responda GLU y el valor, ej. GLU 120.`;
  if(p.cond==="TB")return `CCS: Hola ${p.name}. ¿Tomó su dosis hoy? Responda DOSIS SI o DOSIS NO.`;
  return `CCS: Hola ${p.name}. Reporte su presión hoy. Responda TA y los dos valores, ej. TA 120/80.`;
}
function readingText(r){
  if(r.type==="GLU")return `GLU ${r.v}`;
  if(r.type==="TA")return `TA ${r.v[0]}/${r.v[1]}`;
  if(r.type==="DOSIS")return `DOSIS ${r.v}`;
  return String(r.v);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byId=id=>S.patients.find(p=>p.id===+id);
const ini=n=>n.replace(/\./g,"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
function ago(ms){const m=Math.max(0,Math.round((Date.now()-ms)/MIN));if(m<2)return"ahora";if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<48)return`hace ${h} h`;return`hace ${Math.round(h/24)} d`;}
function hhmm(ms){return new Date(ms).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});}

/* ---------- Motor de reglas ---------- */
function evaluate(p){
  const c=S.cfg,rs=[];let lvl=0,only=true;
  const up=(l,txt,nr)=>{rs.push(txt);lvl=Math.max(lvl,l);if(!nr)only=false;};
  const r=p.readings[p.readings.length-1];
  if(r){
    if(r.type==="GLU"){const v=r.v;
      if(v>=250||v<54)up(2,`Glucosa ${v} mg/dL`);
      else if(v>c.glu||v<70)up(1,`Glucosa ${v} mg/dL (límite ${c.glu})`);}
    if(r.type==="TA"){const[s,d]=r.v;
      if(p.cond==="Gest."){
        if(s>=160||d>=110)up(2,`Presión ${s}/${d} mmHg en gestante`);
        else if(s>=c.gsis||d>=90)up(1,`Presión ${s}/${d} mmHg en gestante (límite ${c.gsis}/90)`);
      }else{
        if(s>=180||d>=110)up(2,`Presión ${s}/${d} mmHg`);
        else if(s>=c.sis||d>=100)up(1,`Presión ${s}/${d} mmHg (límite ${c.sis}/100)`);}}
    if(r.type==="DOSIS"&&r.v==="NO")up(1,"Dosis omitida");
    if(r.type==="SINT")up(2,"Refiere síntomas de alarma");
  }
  const hrs=(Date.now()-p.lastIn)/H;
  if(hrs>=c.horas)up(1,`${Math.floor(hrs)} h sin respuesta (límite ${c.horas} h)`,true);
  const tag=lvl===2?"Crítico":lvl===1?(only?"Sin resp.":"Alerta"):"Estable";
  return{lvl,reasons:rs,tag,noResp:lvl===1&&only,hrs};
}
const pillCls=ev=>ev.lvl===2?"crit":ev.lvl===1?"warn":"ok";
const stOf=p=>S.alertState[p.id]?.status||"abierta";
const isOpen=(p,ev)=>ev.lvl>0&&stOf(p)!=="atendida";
function all(){return S.patients.map(p=>({p,ev:evaluate(p)}));}
const sortAl=(a,b)=>b.ev.lvl-a.ev.lvl||a.p.lastIn-b.p.lastIn;
function repText(p,ev){
  const r=p.readings[p.readings.length-1];
  if(ev.noResp)return`${Math.floor(ev.hrs)} h sin resp.`;
  if(!r)return"Sin reportes";
  return r.type==="GLU"?`GLU ${r.v}`:r.type==="TA"?`${r.v[0]}/${r.v[1]}`:r.type==="DOSIS"?(r.v==="NO"?"Dosis omitida":"Dosis tomada"):"Síntomas";
}

/* ---------- Acciones de datos ---------- */
function log(text){S.log.push({t:Date.now(),text});if(S.log.length>40)S.log.shift();}
function addMsg(pid,dir,text){S.msgs.push({pid,dir,text,t:Date.now()});}
function remind(pid){const p=byId(pid);addMsg(pid,"out",remindText(p));
  log(`Recordatorio programado para ${p.name}`);log(`SMS enviado a +57 3** *** ${String(40+pid).padStart(2,"0")}`);S.flow={pid,lit:3,alert:false};}
function reply(pid,text){
  const p=byId(pid),t=text.trim();if(!t)return;
  addMsg(pid,"in",t);p.lastIn=Date.now();log(`Respuesta de ${p.name}: ${t}`);
  const T=t.toUpperCase();let m,r=null;
  if((m=T.match(/GLU\w*\s*(\d{2,3})/)))r={type:"GLU",v:+m[1]};
  else if((m=T.match(/TA\s*(\d{2,3})\s*[\/\-\s]\s*(\d{2,3})/)))r={type:"TA",v:[+m[1],+m[2]]};
  else if((m=T.match(/DOSIS\s*(SI|SÍ|NO)/)))r={type:"DOSIS",v:m[1]==="NO"?"NO":"SI"};
  else if(/MAL|MAREO|DOLOR|SANGR|AHOGO/.test(T))r={type:"SINT",v:t};
  else if(/AYUDA/.test(T)){addMsg(pid,"out","CCS: "+hint(p));S.flow={pid,lit:5,alert:false};return;}
  if(r&&r.type!=="SINT"&&r.type!==EXPECT[p.cond])r=null;
  if(!r){addMsg(pid,"out","CCS: No entendimos su mensaje. "+hint(p));log("Mensaje no reconocido, se pide reenviar");S.flow={pid,lit:5,alert:false};return;}
  p.readings.push({t:Date.now(),type:r.type,v:r.v});delete S.alertState[pid];
  log("Gateway entrega el reporte a la API");log("Registro guardado en el historial");
  const ev=evaluate(p);
  log(ev.lvl?`Regla activada → ${ev.tag.toUpperCase()}: ${ev.reasons.join("; ")}`:"Reglas evaluadas → en rango");
  addMsg(pid,"out",ev.lvl===2?"CCS: Su reporte es preocupante. Acuda hoy al puesto de salud; un profesional lo contactará.":ev.lvl===1?"CCS: Gracias. Su reporte fue marcado para revisión; lo contactaremos hoy.":`CCS: Gracias ${p.name}. Su valor está en rango. Próximo reporte en 3 días.`);
  if(ev.lvl)log("Alerta enviada al panel del personal de salud");
  S.flow={pid,lit:ev.lvl?8:7,alert:ev.lvl>0};
}
function hint(p){const e=EXPECT[p.cond];return e==="GLU"?"Envíe GLU y el valor, ej. GLU 120.":e==="DOSIS"?"Envíe DOSIS SI o DOSIS NO.":"Envíe TA y los dos valores, ej. TA 120/80.";}
function ussd(pid,opt){const p=byId(pid);addMsg(pid,"in","*123# → "+opt);
  if(opt==="1")addMsg(pid,"out","CCS: "+hint(p));
  else if(opt==="2"){const v=S.alertState[pid]?.visit;addMsg(pid,"out",v?`CCS: Su visita está programada para el ${v}.`:"CCS: No tiene una cita programada.");}
  else addMsg(pid,"out","CCS: Responda AYUDA para ver cómo reportar. En una emergencia acuda al puesto de salud.");
  log(`USSD *123# opción ${opt} de ${p.name}`);}
function note(pid,txt,status){const a=S.alertState[pid]||(S.alertState[pid]={status:"abierta",notes:[]});a.notes=a.notes||[];a.notes.push(`${hhmm(Date.now())} · ${txt}`);if(status)a.status=status;}

/* ---------- UI helpers ---------- */
function icon(path){return`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>`;}
function openCount(){return all().filter(x=>isOpen(x.p,x.ev)).length;}
function chrome(){
  const n=openCount();
  const mk=(cls)=>VIEWS.map(([id,l,d])=>`<button class="${cls}" data-act="nav" data-v="${id}" ${S.view===id?'aria-current="page"':""}>${icon(d)}<span>${l}${id==="alertas"&&n?`<span class="badge" aria-label="${n} alertas abiertas">${n}</span>`:""}</span></button>`).join("");
  document.getElementById("sidenav").innerHTML=mk("nav");
  document.getElementById("tabs").innerHTML=mk("");
  document.getElementById("ttl").textContent=TITLES[S.view];
  const d=new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("sub").textContent=S.view==="resumen"?`${d[0].toUpperCase()+d.slice(1)} · Centro de salud piloto · ${S.patients.length} pacientes`:S.view==="sms"?"Simule el recorrido completo: recordatorio, respuesta del paciente, regla y alerta":S.view==="reglas"?"Umbrales que activan las alertas":"";
  document.getElementById("campBtn").hidden=!(S.view==="resumen"||S.view==="pacientes");
}
let tt;function toast(t){const e=document.getElementById("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600);}
function row(x,extra=""){const{p,ev}=x;return`<button class="row" data-act="openP" data-id="${p.id}">
 <span class="who"><i class="av">${esc(ini(p.name))}</i><span><b>${esc(p.name)}</b><small>Vda. ${esc(p.vereda)}${extra}</small></span></span>
 <span class="cond">${esc(p.cond)}</span>
 <span class="rep">${esc(repText(p,ev))}<small>${ago(p.lastIn)}</small></span>
 <span class="pill ${pillCls(ev)}">${ev.tag}</span></button>`;}

/* ---------- Vistas ---------- */
function vResumen(){
  const a=all(),open=a.filter(x=>isOpen(x.p,x.ev)).sort(sortAl);
  const crit=open.filter(x=>x.ev.lvl===2).length,nr=a.filter(x=>x.ev.noResp&&stOf(x.p)!=="atendida").length;
  const gest=a.filter(x=>x.ev.noResp&&x.p.cond==="Gest.").length;
  const resp=Math.round(100*a.filter(x=>x.ev.hrs<S.cfg.horas).length/a.length);
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(6-i));return d.getTime();});
  const cnt=days.map(d0=>S.msgs.filter(m=>m.t>=d0&&m.t<d0+24*H).length),mx=Math.max(1,...cnt);
  const bars=days.map((d0,i)=>`<div class="${i===6?"today":""}"><b>${cnt[i]}</b><i style="height:${Math.max(4,Math.round(cnt[i]/mx*84))}px"></i><span>${"DLMXJVS"[new Date(d0).getDay()]}</span></div>`).join("");
  const conds=["DM2","HTA","Gest.","TB"].map(c=>[c,open.filter(x=>x.p.cond===c).length]),cm=Math.max(1,...conds.map(c=>c[1]));
  return`<div class="kpis">
   <div class="kpi"><span>Pacientes activos</span><b>${a.length}</b><em class="ok">${a.filter(x=>x.ev.lvl===0).length} estables</em></div>
   <div class="kpi"><span>Alertas abiertas</span><b>${open.length}</b><em class="crit">${crit} críticas</em></div>
   <div class="kpi"><span>Sin respuesta &gt;${S.cfg.horas} h</span><b>${nr}</b><em class="warn">${gest} gestantes</em></div>
   <div class="kpi"><span>Respuesta a SMS</span><b>${resp}%</b><em class="${resp>=80?"ok":"warn"}">meta 80%</em></div></div>
  <div class="grid2"><section class="panel"><h2>Pacientes que requieren atención</h2>
   <div class="rows">${open.length?open.slice(0,7).map(x=>row(x)).join(""):'<div class="empty">No hay alertas abiertas.</div>'}</div></section>
   <div style="display:grid;gap:14px;align-content:start">
    <section class="panel"><h2>Mensajes SMS por día</h2><div class="bars" role="img" aria-label="Mensajes por día, últimos 7 días">${bars}</div></section>
    <section class="panel"><h2>Alertas abiertas por condición</h2>${conds.map(([c,n])=>`<div class="hb"><b style="text-align:left">${c}</b><span><i style="width:${Math.min(100,n/Math.max(4,cm)*100)}%"></i></span><b>${n}</b></div>`).join("")}</section>
   </div></div>`;
}
function vPacientes(){
  return`<div class="bar"><label class="sr" for="q">Buscar paciente</label><input id="q" class="search" type="search" placeholder="Buscar por nombre o vereda" value="${esc(S.q)}" autocomplete="off">
   ${["todos","DM2","HTA","Gest.","TB"].map(c=>`<button class="chip" data-act="pf" data-v="${c}" aria-pressed="${S.pfilter===c}">${c==="todos"?"Todos":c}</button>`).join("")}</div>
   <div class="rows" id="plist">${plist()}</div>`;
}
function plist(){
  const q=S.q.trim().toLowerCase();
  const l=all().filter(x=>(S.pfilter==="todos"||x.p.cond===S.pfilter)&&(!q||(x.p.name+" "+x.p.vereda).toLowerCase().includes(q))).sort((a,b)=>b.ev.lvl-a.ev.lvl||a.p.name.localeCompare(b.p.name));
  return l.length?l.map(x=>row(x,` · ${x.p.age} años`)).join(""):'<div class="empty">Ningún paciente coincide con la búsqueda.</div>';
}
function vAlertas(){
  const a=all().filter(x=>x.ev.lvl>0).sort(sortAl),f=S.afilter;
  const lst=a.filter(x=>{const done=stOf(x.p)==="atendida";
    if(f==="atendidas")return done;if(done)return false;
    return f==="todas"||(f==="criticas"&&x.ev.lvl===2)||(f==="sinresp"&&x.ev.noResp)||(f==="gest"&&x.p.cond==="Gest.")||(f==="tb"&&x.p.cond==="TB");});
  const cnt=k=>a.filter(x=>stOf(x.p)!=="atendida"&&(k==="todas"||(k==="criticas"&&x.ev.lvl===2)||(k==="sinresp"&&x.ev.noResp)||(k==="gest"&&x.p.cond==="Gest.")||(k==="tb"&&x.p.cond==="TB"))).length;
  const F=[["todas","Todas"],["criticas","Críticas"],["sinresp","Sin respuesta"],["gest","Gestantes"],["tb","TB"],["atendidas","Atendidas"]];
  return`<div class="bar">${F.map(([k,l])=>`<button class="chip" data-act="af" data-v="${k}" aria-pressed="${f===k}">${l}${k!=="atendidas"?" "+cnt(k):""}</button>`).join("")}</div>
  <div class="rows">${lst.length?lst.map(({p,ev})=>{const s=stOf(p);return`<article class="acard"><div class="head"><span class="who"><i class="av">${esc(ini(p.name))}</i><span><b>${esc(p.name)} · ${esc(p.cond)}</b><small>Vda. ${esc(p.vereda)} · ${ago(p.lastIn)}</small></span></span><span class="pill ${pillCls(ev)}">${ev.tag}</span></div>
   <ul>${ev.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
   <div class="acts"><span class="st">Estado: ${s==="abierta"?"abierta":s==="seguimiento"?"en seguimiento":"atendida"}</span></div>
   <div class="acts"><button class="btn sm" data-act="call" data-id="${p.id}">Llamar</button><button class="btn sm o" data-act="openP" data-id="${p.id}">Detalle</button>${s!=="atendida"?`<button class="btn sm o" data-act="attend" data-id="${p.id}">Marcar atendida</button>`:""}</div></article>`;}).join(""):'<div class="empty">No hay alertas en esta categoría.</div>'}</div>`;
}
function vReglas(){

   ${f("glu","Glucosa alta","mg/dL.","Se genera alerta por encima de este valor (diabetes tipo 2).")}

   ${f("gsis","Presión sistólica, gestantes","mmHg.","Alerta desde este valor o con diastólica de 90 o más.")}
   ${f("horas","Tiempo sin respuesta","horas.","Pasado este tiempo sin SMS del paciente se genera alerta.")}
   <button class="btn o" data-act="defaults">Restablecer valores</button></section>
   <section class="panel"><h2>Reglas fijas del prototipo</h2><div class="scroll"><table class="rules"><thead><tr><th>Condición</th><th>Nivel</th></tr></thead><tbody>
   <tr><td>Glucosa ≥ 250 o &lt; 54 mg/dL</td><td class="crit">Crítico</td></tr>
   <tr><td>Glucosa &lt; 70 mg/dL</td><td class="warn">Alerta</td></tr>
   <tr><td>Presión ≥ 180/110 mmHg</td><td class="crit">Crítico</td></tr>

function dynSms(){

  const ch={DM2:["GLU 120","GLU 312","Me siento mal"],HTA:["TA 128/82","TA 168/102","TA 190/115"],"Gest.":["TA 118/76","TA 150/96","Me siento mal"],TB:["DOSIS SI","DOSIS NO"]}[p.cond];

/* ---------- Detalle del paciente ---------- */
function spark(p){
  const rs=p.readings.filter(r=>r.type==="GLU"||r.type==="TA"||r.type==="DOSIS").slice(-8);
  if(rs.length<2)return"";
  if(p.cond==="TB")return`<div class="thr" style="flex-direction:row;flex-wrap:wrap;gap:8px">${rs.map(r=>`<span class="pill ${r.v==="NO"?"warn":"ok"}">${r.v==="NO"?"Omitida":"Tomada"}</span>`).join("")}</div>`;
  const vs=rs.map(r=>r.type==="GLU"?r.v:r.v[0]),th=p.cond==="DM2"?S.cfg.glu:p.cond==="Gest."?S.cfg.gsis:S.cfg.sis;
  const lo=Math.min(...vs,th)-10,hi=Math.max(...vs,th)+10,W=300,Hh=96;
  const X=i=>14+i*(W-28)/(vs.length-1),Y=v=>Hh-14-(v-lo)/(hi-lo)*(Hh-28);
  const last=vs.length-1;
  return`<svg class="spark" viewBox="0 0 ${W} ${Hh+6}" role="img" aria-label="Últimos ${vs.length} reportes: ${vs.join(", ")}">
   <line class="th" x1="14" x2="${W-14}" y1="${Y(th)}" y2="${Y(th)}"/><text x="${W-14}" y="${Y(th)-4}" text-anchor="end">límite ${th}</text>
   <polyline class="ln" points="${vs.map((v,i)=>`${X(i)},${Y(v)}`).join(" ")}"/>
   ${vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===last?4.5:2.5}" fill="${i===last&&v>th?"var(--crit)":"var(--accent)"}"/>`).join("")}
   <text x="${X(last)}" y="${Math.min(Hh+2,Y(vs[last])+16)}" text-anchor="end">${vs[last]}</text></svg>`;
}
function sheetHtml(p){
  const ev=evaluate(p),a=S.alertState[p.id],ms=S.msgs.filter(m=>m.pid===p.id).sort((x,y)=>x.t-y.t).slice(-6);
  const tm=new Date(Date.now()+24*H),dv=`${tm.getFullYear()}-${String(tm.getMonth()+1).padStart(2,"0")}-${String(tm.getDate()).padStart(2,"0")}`;
  return`<div class="scrim" data-act="close"></div><section class="sp" role="dialog" aria-modal="true" aria-labelledby="sht">
  <div class="hd"><div><h2 id="sht">${esc(p.name)}</h2><small>${p.age} años · ${esc(p.cond)} · Vda. ${esc(p.vereda)}</small></div><button class="xbtn" data-act="close" aria-label="Cerrar detalle" id="xb">×</button></div>
  <span class="pill ${pillCls(ev)}">${ev.tag}</span>${a?` <span class="st">· ${a.status==="seguimiento"?"en seguimiento":a.status}</span>`:""}
  ${ev.reasons.length?`<ul class="reasons">${ev.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:'<p class="st">Sin alertas. Último reporte '+ago(p.lastIn)+".</p>"}
  <h3>Últimos reportes</h3>${spark(p)}
  <h3>Conversación SMS</h3><div class="thr">${ms.map(m=>`<div class="msg ${m.dir}">${esc(m.text)}<small>${hhmm(m.t)}</small></div>`).join("")}</div>
  ${a?.notes?.length?`<h3>Seguimiento</h3><ul class="notes">${a.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
  <h3>Acciones</h3><div class="acts"><button class="btn" data-act="call" data-id="${p.id}">Llamar</button><button class="btn o" data-act="attend" data-id="${p.id}">Marcar atendida</button><button class="btn o" data-act="remindP" data-id="${p.id}">Enviar recordatorio</button></div>
  <div class="field" style="margin-top:14px"><label for="visitDate">Programar visita</label><div class="acts"><input id="visitDate" type="date" value="${dv}"><button class="btn o" data-act="visit" data-id="${p.id}">Programar</button></div></div>
  <p class="foot">La llamada y el SMS son simulados y quedan registrados en el seguimiento.</p></section>`;
}

  if(openId){const y=document.querySelector("#sheet .sp")?.scrollTop||0;document.getElementById("sheet").innerHTML=sheetHtml(byId(openId));const sp=document.querySelector("#sheet .sp");if(sp)sp.scrollTop=y;}
}
function refresh(){if(S.view==="sms"){chrome();dynSms();if(openId){const sp=document.querySelector("#sheet .sp"),y=sp?.scrollTop||0;document.getElementById("sheet").innerHTML=sheetHtml(byId(openId));document.querySelector("#sheet .sp").scrollTop=y;}}else render();}
function go(v){if(!TITLES[v])v="resumen";S.view=v;if(location.hash!=="#"+v)location.hash=v;render();window.scrollTo(0,0);}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="nav")go(b.dataset.v);
  else if(a==="openP")openSheet(id);
  else if(a==="close")closeSheet();
  else if(a==="pf"){S.pfilter=b.dataset.v;render();}
  else if(a==="af"){S.afilter=b.dataset.v;render();}
  else if(a==="campaign"){S.patients.forEach(p=>remind(p.id));S.flow={pid:S.selPid,lit:3,alert:false};log(`Campaña enviada a ${S.patients.length} pacientes`);toast(`Recordatorio enviado a ${S.patients.length} pacientes (simulado)`);refresh();}
  else if(a==="call"){const p=byId(id);note(+id,`Llamada registrada a ${p.name} (simulada)`,"seguimiento");toast(`Llamada a ${p.name} registrada`);refresh();}
  else if(a==="attend"){const p=byId(id);note(+id,"Alerta marcada como atendida","atendida");toast(`Alerta de ${p.name} atendida`);refresh();}
  else if(a==="visit"){const v=document.getElementById("visitDate").value;if(!v){toast("Elija una fecha para la visita");return;}const p=byId(id);const f=v.split("-").reverse().join("/");note(+id,`Visita programada para el ${f}`,"seguimiento");S.alertState[+id].visit=f;toast(`Visita de ${p.name} programada`);refresh();}
  else if(a==="remindP"){remind(+id);toast("Recordatorio enviado (simulado)");refresh();}
  else if(a==="remind"){remind(S.selPid);refresh();}
  else if(a==="simnr"){const p=byId(S.selPid);p.lastIn=Date.now()-(S.cfg.horas+4)*H;delete S.alertState[p.id];log(`Simulación: ${S.cfg.horas+4} h sin respuesta de ${p.name}`);S.flow={pid:p.id,lit:7,alert:evaluate(p).lvl>0};refresh();}
  else if(a==="reset"){const v=S.view;S=seed();S.view=v;openId=null;closeSheet();toast("Datos de ejemplo restablecidos");render();}
  else if(a==="chip"){const i=document.getElementById("smsText");i.value=b.dataset.t;i.focus();}
  else if(a==="ussd"){ussd(S.selPid,b.dataset.o);refresh();}
  else if(a==="defaults"){S.cfg={...cfg0};toast("Valores restablecidos");render();}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="smsForm"){e.preventDefault();const i=document.getElementById("smsText");reply(S.selPid,i.value);i.value="";refresh();i.focus();}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;document.getElementById("plist").innerHTML=plist();}
});
document.addEventListener("change",e=>{
  if(e.target.id==="smsPatient"){S.selPid=+e.target.value;dynSms();}
  else if(e.target.dataset.cfg){const k=e.target.dataset.cfg,v=Math.max(1,Math.min(400,parseInt(e.target.value,10)||cfg0[k]));S.cfg[k]=v;e.target.value=v;chrome();toast("Regla actualizada; las alertas se recalcularon");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId)closeSheet();});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(TITLES[v]&&v!==S.view){S.view=v;render();}});

S=seed();
{const v=location.hash.slice(1);if(TITLES[v])S.view=v;}
render();
</script>
